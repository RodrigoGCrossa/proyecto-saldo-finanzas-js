<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CashFlow</title>

    <!-- CSS de Toastify -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

    <!-- CSS propio -->
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <header class="encabezado">
      <div>
        <h1>CashFlow</h1>
        <p>Control de ingresos y gastos desde un mismo lugar</p>
      </div>
    </header>

    <main class="contenedor">
      <section class="resumen-financiero">
        <article class="tarjeta tarjeta-saldo">
          <h2>Saldo actual</h2>
          <p id="saldo-total">$U 0</p>
        </article>

        <article class="tarjeta tarjeta-ingresos">
          <h2>Ingresos</h2>
          <p id="ingresos-total">$U 0</p>
        </article>

        <article class="tarjeta tarjeta-gastos">
          <h2>Gastos</h2>
          <p id="gastos-total">$U 0</p>
        </article>
      </section>

      <section class="zona-principal">
        <article class="panel">
          <h2>Nuevo movimiento</h2>

          <form id="formulario-movimiento">
            <div class="campo">
              <label for="tipo">Tipo</label>

              <select id="tipo" name="tipo">
                <option value="">Seleccionar tipo</option>
                <option value="ingreso">Ingreso</option>
                <option value="gasto">Gasto</option>
              </select>
            </div>

            <div class="campo">
              <label for="descripcion">Descripción</label>

              <input
                type="text"
                id="descripcion"
                name="descripcion"
                placeholder="Ejemplo: Supermercado"
              />
            </div>

            <div class="campo">
              <label for="categoria">Categoría</label>

              <select id="categoria" name="categoria">
                <option value="">Seleccionar categoría</option>
                <option value="Trabajo">Trabajo</option>
                <option value="Vivienda">Vivienda</option>
                <option value="Alimentación">Alimentación</option>
                <option value="Transporte">Transporte</option>
                <option value="Salud">Salud</option>
                <option value="Educación">Educación</option>
                <option value="Ocio">Ocio</option>
                <option value="Otros">Otros</option>
              </select>
            </div>

            <div class="campo">
              <label for="monto">Monto</label>

              <input
                type="number"
                id="monto"
                name="monto"
                min="1"
                placeholder="0"
              />
            </div>

            <div class="campo">
              <label for="fecha">Fecha</label>

              <input type="date" id="fecha" name="fecha" />
            </div>

            <button type="submit">Guardar movimiento</button>
          </form>
        </article>

        <article class="panel">
          <h2>Resumen de actividad</h2>

          <div class="estadisticas-actividad">
            <p>
              Movimientos registrados
              <strong id="cantidad-movimientos">0</strong>
            </p>

            <p>
              Ingresos registrados
              <strong id="cantidad-ingresos">0</strong>
            </p>

            <p>
              Gastos registrados
              <strong id="cantidad-gastos">0</strong>
            </p>
          </div>
        </article>
      </section>

      <section class="panel historial">
        <div class="encabezado-historial">
          <h2>Historial de movimientos</h2>

          <div class="controles">
            <div class="campo">
              <label for="filtro-tipo">Mostrar</label>

              <select id="filtro-tipo">
                <option value="todos" selected>Todos</option>

                <option value="ingreso">Ingresos</option>

                <option value="gasto">Gastos</option>
              </select>
            </div>

            <div class="campo">
              <label for="orden-movimientos"> Ordenar </label>

              <select id="orden-movimientos">
                <option value="recientes" selected>Más recientes</option>

                <option value="antiguos">Más antiguos</option>
              </select>
            </div>
          </div>
        </div>

        <div id="lista-movimientos">
          <p>Todavía no hay movimientos para mostrar.</p>
        </div>
      </section>
    </main>

    <!-- JavaScript de Toastify -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>

    <!-- JavaScript propio -->
    <script src="./js/app.js"></script>
  </body>
</html>
